name: phase-ci
on:
  push:
    branches: [ main, fix/stabilize-enterprise-runtime, phase2/complete-backend, phase3/react-frontend, phase4-auth-jwt-rbac ]
  pull_request:
    branches: [ main ]
jobs:
  ai-service-test:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m training.sentiment.pipeline --help
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: enterprise_risk_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d enterprise_risk_db" --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DB_PORT: 5432
      DB_NAME: enterprise_risk_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      BOOTSTRAP_ADMIN_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -f backend/pom.xml clean verify
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-browser-results
          path: frontend/test-results
          retention-days: 7

  demo-launcher-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check demo configuration and PowerShell syntax
        shell: pwsh
        run: ./scripts/tests/Start-DemoConfig.Tests.ps1
