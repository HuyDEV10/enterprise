server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: enterprise-risk-backend
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:enterprise_risk_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:ZW50ZXJwcmlzZS1yaXNrLWRldi1qd3Qtc2VjcmV0LWtleS0yMDI2IQ==}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@enterprise.local}
    full-name: ${BOOTSTRAP_ADMIN_FULL_NAME:System Administrator}
  risk-monitoring:
    enabled: ${RISK_MONITORING_ENABLED:true}
    cron: ${RISK_MONITORING_CRON:0 */5 * * * *}
    delayed-order:
      high-after-days: ${RISK_ORDER_HIGH_AFTER_DAYS:3}
      critical-after-days: ${RISK_ORDER_CRITICAL_AFTER_DAYS:7}
    delayed-shipment:
      high-after-days: ${RISK_SHIPMENT_HIGH_AFTER_DAYS:3}
      critical-after-days: ${RISK_SHIPMENT_CRITICAL_AFTER_DAYS:7}
  ai-service:
    enabled: ${AI_SERVICE_ENABLED:true}
    base-url: ${AI_SERVICE_BASE_URL:http://localhost:8000}
    connect-timeout-ms: ${AI_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_SERVICE_READ_TIMEOUT_MS:5000}
    inventory-risk-cron: ${AI_INVENTORY_RISK_CRON:0 */15 * * * *}
  external-intelligence:
    gdelt:
      last-update-url: ${GDELT_LAST_UPDATE_URL:https://data.gdeltproject.org/gdeltv2/lastupdate.txt}
